<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orientation Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0f0d;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .card {
      background: #121815;
      border: 1px solid #26332c;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #1c2a22;
      border: 2px solid #3b6b50;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8d9b93;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #2b3931;
      background: #18201b;
      color: #aab5ae;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #315c43;
      color: white;
      border-color: #47795b;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #b8c2bc;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      background: #0c110e;
      border: 1px solid #2b3931;
      border-radius: 9px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #4b805f;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #356447;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #417b56;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
    }

    .message.error {
      display: block;
      background: #351b1b;
      color: #ff9b9b;
      border: 1px solid #613333;
    }

    .message.success {
      display: block;
      background: #183522;
      color: #9be0ae;
      border: 1px solid #356c45;
    }

    .admin-note {
      margin-top: 18px;
      text-align: center;
      color: #69756e;
      font-size: 11px;
    }

    .hidden {
      display: none !important;
    }

    .welcome {
      text-align: center;
    }

    .welcome h2 {
      margin-bottom: 12px;
    }

    .welcome p {
      color: #9ca8a0;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .orientation-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #356447;
      color: white;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
    }

    .logout {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #9ca8a0;
      border: 1px solid #2b3931;
      border-radius: 9px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card" id="loginCard">

      <div class="logo">📋</div>

      <h1>Orientation Portal</h1>
      <p class="subtitle">Please select your account type</p>

      <div class="tabs">
        <button class="tab active" id="userTab" onclick="showLogin('user')">
          User Login
        </button>

        <button class="tab" id="adminTab" onclick="showLogin('admin')">
          Admin Login
        </button>
      </div>

      <!-- USER LOGIN -->

      <form id="userForm" class="form active" onsubmit="userLogin(event)">

        <label for="userEmail">Email</label>
        <input
          type="email"
          id="userEmail"
          placeholder="Enter your email"
          required
        >

        <label for="userPassword">Password</label>
        <input
          type="password"
          id="userPassword"
          placeholder="Enter your password"
          required
        >

        <button class="login-btn" type="submit">
          Login
        </button>

      </form>

      <!-- ADMIN LOGIN -->

      <form id="adminForm" class="form" onsubmit="adminLogin(event)">

        <label for="adminEmail">Admin Email</label>
        <input
          type="email"
          id="adminEmail"
          placeholder="Enter admin email"
          required
        >

        <label for="adminPassword">Admin Password</label>
        <input
          type="password"
          id="adminPassword"
          placeholder="Enter admin password"
          required
        >

        <button class="login-btn" type="submit">
          Admin Login
        </button>

        <p class="admin-note">
          Authorized administrators only.
        </p>

      </form>

      <div id="message" class="message"></div>

    </div>


    <!-- USER APPROVED PAGE -->

    <div class="card hidden" id="userPanel">

      <div class="welcome">

        <div class="logo">✓</div>

        <h2>Access Approved</h2>

        <p>
          Your account has been approved.
          You may now access the orientation.
        </p>

        <!-- PALITAN MO ITO NG CANVA LINK MO -->
        <a
          href="YOUR_CANVA_LINK_HERE"
          target="_blank"
          class="orientation-btn"
        >
          Open Orientation
        </a>

        <button class="logout" onclick="logout()">
          Logout
        </button>

      </div>

    </div>


    <!-- ADMIN PANEL -->

    <div class="card hidden" id="adminPanel">

      <div class="welcome">

        <div class="logo">🛡️</div>

        <h2>Admin Panel</h2>

        <p>
          You are logged in as an administrator.
        </p>

        <button class="orientation-btn" onclick="showMessage('Approval system will be connected next.')">
          Approval Management
        </button>

        <button class="logout" onclick="logout()">
          Logout
        </button>

      </div>

    </div>

  </div>


  <script>

    function showLogin(type) {

      const userForm = document.getElementById("userForm");
      const adminForm = document.getElementById("adminForm");

      const userTab = document.getElementById("userTab");
      const adminTab = document.getElementById("adminTab");

      clearMessage();

      if (type === "user") {

        userForm.classList.add("active");
        adminForm.classList.remove("active");

        userTab.classList.add("active");
        adminTab.classList.remove("active");

      } else {

        adminForm.classList.add("active");
        userForm.classList.remove("active");

        adminTab.classList.add("active");
        userTab.classList.remove("active");

      }
    }


    function userLogin(event) {

      event.preventDefault();

      /*
        TEMPORARY ONLY.

        Later we will replace this with real authentication
        and an approval-status check.
      */

      const email = document.getElementById("userEmail").value;
      const password = document.getElementById("userPassword").value;

      if (!email || !password) {
        showMessage("Please enter your email and password.", "error");
        return;
      }

      showMessage(
        "Login system is ready. Authentication will be connected next.",
        "success"
      );
    }


    function adminLogin(event) {

      event.preventDefault();

      /*
        DO NOT PUT REAL ADMIN PASSWORDS HERE.

        This will later be connected to secure authentication.
      */

      const email = document.getElementById("adminEmail").value;
      const password = document.getElementById("adminPassword").value;

      if (!email || !password) {
        showMessage("Please enter your admin credentials.", "error");
        return;
      }

      showMessage(
        "Admin authentication will be connected next.",
        "success"
      );
    }


    function showMessage(text, type = "success") {

      const message = document.getElementById("message");

      message.textContent = text;
      message.className = "message " + type;

    }


    function clearMessage() {

      const message = document.getElementById("message");

      message.textContent = "";
      message.className = "message";

    }


    function logout() {

      document.getElementById("loginCard").classList.remove("hidden");
      document.getElementById("userPanel").classList.add("hidden");
      document.getElementById("adminPanel").classList.add("hidden");

      document.getElementById("userForm").reset();
      document.getElementById("adminForm").reset();

      showLogin("user");

    }


    function showMessage(text) {

      alert(text);

    }

  </script>

</body>
</html>
